<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Wei (Phoebe) He — instructional designer building AI for learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="320" fill="#14324A"/>

  <!-- name and line -->
  <text x="72" y="148" fill="#EAF2F4" font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1">Wei (Phoebe) He</text>
  <text x="74" y="198" fill="#B9CFD6" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic">I design how people learn, and build the AI that helps.</text>
  <text x="74" y="246" fill="#7FA99B" font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">Instructional design   /   AI enablement   /   learning analytics</text>

  <!-- competency map: 11 skills, some mastered, some in progress -->
  <g stroke="#3E6378" stroke-width="2" fill="none">
    <path d="M800 90 L880 60 L960 100 L1050 70 L1120 120"/>
    <path d="M880 60 L900 160 L960 100"/>
    <path d="M900 160 L820 210 L800 90"/>
    <path d="M900 160 L990 220 L1050 70"/>
    <path d="M990 220 L1080 250 L1120 120"/>
    <path d="M820 210 L910 265 L990 220"/>
    <path d="M1050 70 L1080 175 L1120 120"/>
    <path d="M1080 175 L990 220"/>
  </g>

  <!-- mastered -->
  <g fill="#F2B134">
    <circle cx="800" cy="90" r="13"/>
    <circle cx="880" cy="60" r="13"/>
    <circle cx="900" cy="160" r="13"/>
    <circle cx="820" cy="210" r="13"/>
  </g>
  <!-- in progress -->
  <g fill="#14324A" stroke="#F2B134" stroke-width="4">
    <circle cx="960" cy="100" r="11"/>
    <circle cx="990" cy="220" r="11"/>
    <circle cx="910" cy="265" r="11"/>
  </g>
  <!-- not yet -->
  <g fill="#14324A" stroke="#7FA99B" stroke-width="2.5">
    <circle cx="1050" cy="70" r="10"/>
    <circle cx="1120" cy="120" r="10"/>
    <circle cx="1080" cy="175" r="10"/>
    <circle cx="1080" cy="250" r="10"/>
  </g>
</svg>
